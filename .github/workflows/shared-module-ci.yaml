name: KenyaEMR Module CI

on:
  push:
    branches:
      - master


jobs:
  deploy-module:
    uses: Palladium-hub/platform-ci/.github/workflows/kenyaemr-module-ci.yaml@main
    with:
      deploy_branch: "master"
      source_branch: "master"
      module_repo: "Palladium-hub/openmrs-module-kenyaemr"
      module_dir_name: "openmrs-module-kenyaemr"
      remote_base_dir: "/apps/githubworkflows/kenyaemr-modules"
      omod_glob: "kenyaemr-*.omod"
      openmrs_modules_dir: "/var/lib/OpenMRS/modules"
      tomcat_service: "tomcat9"
      command_timeout: "200m"
    secrets: inherit
